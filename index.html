<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Malin V2</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>Batch Malin</h1>

        <p class="subtitle">
            Génère automatiquement des repas économiques adaptés à ton budget et ton matériel.
        </p>

        <div class="card">

            <h2>Mes paramètres</h2>

            <label>Budget (€)</label>
            <br>
            <input type="number" id="budget" value="50">

            <br><br>

            <label>Nombre de repas</label>
            <br>

            <select id="meals">
                <option>7</option>
                <option>14</option>
                <option>21</option>
                <option>28</option>
            </select>

            <br><br>

            <label>Nombre de personnes</label>
            <br>

            <input type="number" id="people" value="1">

            <br><br>
            <h3>Matériel disponible</h3>

<div id="equipmentContainer">

</div>

<br>

            <button id="generateBtn">
                Générer mon menu
            </button>

        </div>

        <br>

        <div class="card">

            <h2>Résultats</h2>

            <div id="results">
                Aucun menu généré.
            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
